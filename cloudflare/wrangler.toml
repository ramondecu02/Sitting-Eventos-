name = "lesmoles-events"
main = "src/worker.js"
compatibility_date = "2025-09-16"

# La aplicación (un único HTML) se sirve como asset estático.
# El Worker atiende /api/* y el resto cae en los assets.
[assets]
directory = "./public"
binding = "ASSETS"

# Base de datos D1 (ya creada en la cuenta). Guarda usuarios y el documento
# compartido de eventos.
[[d1_databases]]
binding = "DB"
database_name = "lesmoles-events"
database_id = "d972615b-2a59-4fa1-8126-3f3de7e39cc6"

# SESSION_SECRET NO va aquí (es un secreto). Configúralo con:
#   npx wrangler secret put SESSION_SECRET
# o en el panel de Cloudflare: Worker → Settings → Variables and Secrets.
