name: Demo Les Moles · Cloudflare Pages

# Construye la demo de la Home (lesmoles-demo/) en cada cambio.
# Si existen los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID,
# además la publica en Cloudflare Pages (una URL por rama).

"on":
  push:
    paths: ["lesmoles-demo/**", ".github/workflows/lesmoles-demo.yml"]
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: lesmoles-demo
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lesmoles-demo/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir
        run: npm run build

      - name: Crear el proyecto en Pages (si no existe)
        if: env.HAS_CF == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create lesmoles-demo --production-branch=main

      - name: Desplegar en Cloudflare Pages
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lesmoles-demo
          command: pages deploy dist --project-name=lesmoles-demo --branch=${{ github.ref_name }}

      - name: URL de la demo
        if: env.HAS_CF == 'true'
        run: echo "### Demo publicada → ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Sin credenciales de Cloudflare
        if: env.HAS_CF != 'true'
        run: echo "Construida correctamente. Para publicarla, añade los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID (ver lesmoles-demo/README.md)." >> "$GITHUB_STEP_SUMMARY"
